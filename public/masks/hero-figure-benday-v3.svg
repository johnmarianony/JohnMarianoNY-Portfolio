<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" preserveAspectRatio="none">
  <!-- White = visible. Gaps between dots must stay empty (no solid underlay). -->
  <defs>
    <linearGradient id="solidFade" gradientUnits="userSpaceOnUse" x1="0" y1="660" x2="0" y2="720">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bd1" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="2.45" fill="#fff"/>
    </pattern>
    <pattern id="bd2" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.15" fill="#fff"/>
    </pattern>
    <pattern id="bd3" width="9.5" height="9.5" patternUnits="userSpaceOnUse">
      <circle cx="4.75" cy="4.75" r="1.75" fill="#fff"/>
    </pattern>
    <pattern id="bd4" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="1.35" fill="#fff"/>
    </pattern>
    <pattern id="bd5" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="6.5" cy="6.5" r="0.95" fill="#fff"/>
    </pattern>
  </defs>
  <!-- Fully solid through face + upper polo -->
  <rect x="0" y="0" width="720" height="670" fill="#fff"/>
  <!-- Soft handoff into the dissolve -->
  <rect x="0" y="660" width="720" height="60" fill="url(#solidFade)"/>
  <!-- Ben-Day only (transparent between dots) — denser → sparser -->
  <rect x="0" y="655" width="720" height="55" fill="url(#bd1)"/>
  <rect x="0" y="700" width="720" height="50" fill="url(#bd2)" opacity="0.85"/>
  <rect x="0" y="740" width="720" height="50" fill="url(#bd3)" opacity="0.65"/>
  <rect x="0" y="780" width="720" height="55" fill="url(#bd4)" opacity="0.4"/>
  <rect x="0" y="825" width="720" height="55" fill="url(#bd5)" opacity="0.2"/>
  <rect x="0" y="870" width="720" height="90" fill="url(#bd5)" opacity="0.07"/>
</svg>
